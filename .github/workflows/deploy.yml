name: Deploy Xgram to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing GitHub secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub secret: VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Build Xgram SPA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npm run build

      - name: Find and prepare SPA output
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for index.html..."

          INDEX_FILE=""

          # Check common output locations first
          for file in \
            "dist/index.html" \
            "dist/client/index.html" \
            ".output/public/index.html" \
            "build/index.html" \
            "public/index.html"
          do
            if [ -f "$file" ]; then
              INDEX_FILE="$file"
              break
            fi
          done

          # Search other build directories if necessary
          if [ -z "$INDEX_FILE" ]; then
            INDEX_FILE=$(find . \
              -type d \( -name node_modules -o -name .git \) -prune \
              -o -type f -name index.html -print \
              | head -n 1 || true)
          fi

          if [ -z "$INDEX_FILE" ] || [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            echo "Build output:"
            find . \
              -type d \( -name node_modules -o -name .git \) -prune \
              -o -type f -print \
              | head -200
            exit 1
          fi

          PAGES_DIR="$(dirname "$INDEX_FILE")"

          echo "Found: $INDEX_FILE"
          echo "Pages directory: $PAGES_DIR"

          cp "$INDEX_FILE" "$PAGES_DIR/404.html"

          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"

          echo "Prepared SPA fallback successfully."

          ls -la "$PAGES_DIR"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
