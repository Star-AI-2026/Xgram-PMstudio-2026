
name: Deploy Xgram to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify browser bundle has no TanStack Start server code
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '@tanstack/react-start|@tanstack/start-server-core|createServerFn|useServerFn|createMiddleware|SUPABASE_SERVICE_ROLE_KEY|LOVABLE_CRON_SECRET|node:crypto|process\.env' src; then
            echo "ERROR: TanStack Start/server-only code is still inside src/."
            exit 1
          fi
          if find src -type f \( -name '*.server.ts' -o -name '*.server.tsx' -o -name 'server.ts' -o -name 'start.ts' \) | grep -q .; then
            echo "ERROR: server entry files must not be placed inside src/."
            find src -type f \( -name '*.server.ts' -o -name '*.server.tsx' -o -name 'server.ts' -o -name 'start.ts' \)
            exit 1
          fi
          echo "Pure browser SPA source check passed."

      - name: Verify Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "Missing GitHub secret: VITE_SUPABASE_URL"
            exit 1
          }

          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "Missing GitHub secret: VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          }

      - name: Build Xgram SPA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npm run build

      - name: Prepare GitHub Pages SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not generated."

            echo "Build output:"
            find dist -maxdepth 4 -type f -print 2>/dev/null || true

            exit 1
          fi

          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          echo "SPA output prepared successfully."
          find dist -maxdepth 2 -type f | sort | head -100

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
